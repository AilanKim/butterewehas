<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Stop</title>
    <style>
        .color-navy {color: navy;}
        .color-aqua{color: aqua;}
        .font-size-50px{font-size: 50px;}
        .font-size-20px{font-size: 20px;}
        .font-size-10px{font-size: 10px;}
        .font-weight-bold{font-weight: 900;}
        .text-left{text-align: left;}
        .text-left{text-align: right;}
        .text-left{text-align: center;}
        .text-left{text-align: end;}

    </style>
</head>

<body>
    <!-- 버스 글씨 메인 화면-->
    <body style="background-color: rgb(223, 255, 244);">

    <!-- 1. 버스 로고 (h1 태그 + style 속성) -->
    <h1 style="font-size: 100px; font-family: Arial, 
    sans-serif; font-weight: 900; color: #0000cd; 
    text-transform: uppercase; -webkit-text-stroke: 2px #add8e6; 
    letter-spacing: -10px; margin: 0;">
        BUS
    </h1>

    <!-- 2. 둥근 네모 박스 -->
    <br>
    <div style="border: 10px solid rgb(135, 255, 155); 
    border-radius: 10px; padding: 50px; width: 30px;"></div>

    <!-- 3. 하단 문구들 -->
    <p class="font-size: 20px;">Add Bus Stop</p>

    <!--여기 둥근 네모 박스 부분-->
    <div style="border: 10px solid rgb(118, 193, 255); 
    border-radius: 10px; padding: 50px; width: 30px;"></div>
    <p class = "font-size-20px">Go to home</p>

    <div style="border: 10px solid rgb(255, 181, 181); 
    border-radius: 10px; padding: 50px; width: 30px;"></div>
    <p class="font-size-50px">Go to work</p>
    <!-- 실선부분-->
    <div style="border: 5px solid rgb(155, 213, 255);"></div>
    <!-- 배경색 을 채운 둥근 상자 -->
    <div style="
    background: linear-gradient(to right, rgb(255, 181, 181) 50%,
    rgb(155, 213, 255) 50%); 
    padding: 150px; width: 100px;">
    </div>
</body>
</html>
