<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍜 Noodles & Ramen</title>
    <style>
        /* 기본 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f4f4f4;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 아이폰 16 프로 프레임 */
        .phone-container {
            width: 375px;
            height: 812px;
            background-color: #fff6eb; /* 상단 살구색 배경 */
            border-radius: 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column; /* 세로 정렬 필수! */
            position: relative;
        }

        /* 상단 네비게이션 (살구색 배경에 맞게 어두운 글자색 적용) */
        .top-nav {
            position: absolute;
            top: 24px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 30;
        }

        .back-btn {
            font-size: 22px;
            font-weight: bold;
            color: #000000; /* 잘 보이도록 어두운 색으로 수정 */
            text-decoration: none;
            line-height: 1;
        }

        .header-text {
            color: #000000; /* 잘 보이도록 어두운 색으로 수정 */
            font-size: 15px;
            font-weight: 600;
        }

        /* 상단 살구색 영역 (전골/라면 이모지 중앙 배치) */
        .content-top {
            flex: 1; /* 남은 위쪽 공간을 가변적으로 모두 차지 */
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 40px;
        }

        .ramen-emoji {
            font-size: 90px;
            user-select: none;
        }

        /* 하단 주황색 카드 영역 */
        .content-bottom {
            background-color: #b6896f;
            border-top-left-radius: 32px;  /* 하단 카드 느낌의 라운드 처리 */
            border-top-right-radius: 32px;
            padding: 40px 20px 50px 20px;   /* 위아래 여백을 주어 버튼 안정적으로 배치 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 버튼 모아주는 컨테이너 */
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 16px;               /* 버튼 간격 균일하게 설정 */
            align-items: center;
            width: 100%;
        }

        /* 버튼 디테일 구성 */
        .menu-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 180px;                 
            padding: 14px 0;              
            background-color: #ffffff; 
            border-radius: 20px;          
            
            color: #b6896f;     /* 버튼 글자 주황색 */
            font-size: 18px;
            font-family: Verdana, sans-serif;             
            font-weight: bold;            
            text-decoration: none;        
            
            box-shadow: 0 4px 0px #b6896f; 
            transition: transform 0.1s;
        }

        .menu-btn:active {
            transform: scale(0.96); /* 터치 시 눌리는 효과 */
        }

    </style>
</head>
<body>

    <div class="phone-container">
        <!-- 상단 네비게이션 (뒤로가기 + 타이틀) -->
        <div class="top-nav">
            <a href="page3.html" class="back-btn">←</a>
            <span class="header-text">Noodles and Ramen</span>
        </div>

        <!-- 상단 영역 (이모지) -->
        <div class="content-top">
            <span class="ramen-emoji">🍲</span>
        </div>

        <!-- 하단 영역 (주황색 바텀 시트 + 버튼 3개) -->
        <div class="content-bottom">
            <div class="menu-container">
                <a href="Korea_noodles_soup/noodles_soup.html" class="menu-btn">Noodles(Soup)</a>
                <a href="Korea_noodles_bibim/bibim_noodles.html" class="menu-btn">Noodles(Bibim)</a>
                <a href="Korea_noodles_other/ol_noodles.html" class="menu-btn">Noodles(Other)</a>
            </div>
        </div>
    </div>

</body>
</html>
