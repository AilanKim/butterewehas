<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍜🍜🍜</title>
    <style>
        /* 기본 초기화 */
        body, p, div {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f4f4f4;
            font-family: 'Pretendard', 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 아이폰 16 프로 프레임 */
        .phone-container {
            width: 375px;
            height: 812px;
            background-color: #fff;
            border-radius: 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 상단 헤더 텍스트 이 페이지에서는 보류하기 숨기기*/
        .header-text {
            color: #b0b0b0;
            font-size: 14px;
            padding: 20px 0 0 20px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            display : none;
        }

        /* 뒤로가기 버튼 스타일 */
        .back-btn {
            position: absolute;
            top: 16px;
            left: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #4a2111;
            text-decoration: none;
            z-index: 30;
            line-height: 1;
        }

        /* 2x2 그리드 컨테이너 */
        .grid-container {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2열 (반반) */
            grid-template-rows: 1fr 1fr;    /* 2행 (반반) */
        }

        /* 공통 그리드 셀 스타일 */
        .grid-item {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 85px; /* 이모지 크기 설정 */
            user-select: none;
            text-decoration: none; /* 밑줄제거 */
            color : inherit /* 이모지유지 */
        }

        /* 1. 왼쪽 상단 (흰색 배경) */
        .item-top-left {
            background-color: #ffffff;
        }

        /* 2. 오른쪽 상단 (주황색 배경) */
        .item-top-right {
            background-color: #ff8533;
        }

        /* 3. 왼쪽 하단 (주황색 배경) */
        .item-bottom-left {
            background-color: #ff8533;
        }

        /* 4. 오른쪽 하단 (흰색 배경) */
        .item-bottom-right {
            background-color: #ffffff;
        }

        /* 이모지 링크로 활용 시 (필요할 때 적용) */
        .grid-item a {
            text-decoration: none;
            color: inherit;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- 1. 전체를 감싸는 아이폰 프레임 시작 -->
    <div class="phone-container">

        <!-- 뒤로가기 버튼 및 상단 텍스트 글씨랑 겹치면 옮기기-->
        <a href="history.html" class="back-btn">←</a>
        <p class="header-text">Noodles and Ramen</p>

    <!-- 2x2 격자 영역 -->
    <div class="grid-container">
        <!-- 1행 1열: 라면 (이동하고 싶은 페이지 링크 적기) -->
        <a href="page_ramen.html" class="grid-item item-top-left">
            🍜
        </a>

        <!-- 1행 2열: 나베/전골 -->
        <a href="page_noodles.html" class="grid-item item-top-right">
        🍲
        </a>

        <!-- 2행 1열: 스파게티 -->
        <a href="paga_spaghetti.html" class="grid-item item-bottom-left">
            🍝
        </a>

        <!-- 2행 2열: 지구 -->
        <a href="page_abroad.html" class="grid-item item-bottom-right">
            🌍
        </a>
</div>
</body>
</html>
