<!--선언부-->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍜🍜🍜</title>
    <style>
        /* 기본 초기화 */
        body, h1, h3, p, div {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f4f4f4;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 아이폰 16 프로 프레임 */
        .phone-container {
            width: 375px;
            height: 812px;
            background-color: #fce1c6; /* 살구색 배경 */
            border-radius: 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 상단 헤더 텍스트 */
        .header-text {
            color: #b0b0b0;
            font-size: 14px;
            padding: 20px 0 0 50px; /* 뒤로가기 버튼과 안 겹치게 여백 조절 */
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        /* 뒤로가기 버튼 스타일 */
        .back-btn {
            position: absolute;
            top: 16px;
            left: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #4a2111;
            text-decoration: none;
            z-index: 30;
            line-height: 1;
        }

        /* 메인 본문 영역 (텍스트 + 줄무늬 배경) */
        .content-body {
            flex: 1;
            padding: 60px 25px 20px 25px;
            position: relative;
            background-image: linear-gradient(
                90deg,
                transparent 30%,
                rgba(255, 255, 255, 0.4) 50%
            );
            background-size: 30px 50%;
        }

        /* 타이틀: 면의 역사 */
        .title {
            font-size: 50px;
            color: #4a2111;
            margin-bottom: 50px;
            margin-top:10px;
        }

        /* 역사 글 상자 목록 */
        .history-item {
            margin-bottom: 30px;
            color: #4a2111;
            line-height: 1.45;
            font-size: 15px;
            word-break: keep-all;
        }

        .history-item .country {
            font-size: 13px;
            color: #000000;
            margin-bottom: 2px;
            font-weight: bolder;
        }

        .history-item strong {
            font-weight: 800;
            color: #4a2111;
        }

        /* 주황색 화살표 (다음 페이지 링크용) */
        .arrow-next {
            position: absolute;
            right: 20px;
            bottom: 30px;
            top: 90%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arrow-next::before {
            content: '';
            width: 30px;
            height: 4px;
            background-color: #ff5522;
            position: absolute;
        }

        .arrow-next::after {
            content: '';
            width: 12px;
            height: 12px;
            border-top: 4px solid #ff5522;
            border-right: 4px solid #ff5522;
            transform: rotate(45deg);
            position: absolute;
            right: 4px;
        }

        .content-bottom {
            height: 220px;
            background-color: #ff8533;
            display: flex;
            justify-content: flex-end; /* 오른쪽 정렬 */
            align-items: flex-end;     /* 아래쪽 정렬 */
            padding-right: 20px;       /* 오른쪽 여백 */
            padding-bottom: 10px;      /* 아래쪽 여백 */
        }

        /* 라면 이미지 스타일 -> 텍스트로 바꾸기 */
        .ramen-bowl {
            display: inline-block;
            text-decoration: none;
            width: 200px; /* 이미지 없애고 텍스트로 돌리기 */
            height: auto; /* 비율 유지 */
            text-align: center;
            font-size: 80px; /* 텍스트로 돌리니까 폰트 사이즈로 유지*/
            color: white;
            border: 0px dashed white; /* 이미지 위치 표시용, 점선 삭제 */
            padding: 0px;
        }

                h1 {
            margin: 0;
            line-height: 1; 
            }

    </style>
</head>
<body>

    <!-- 1. 전체를 감싸는 아이폰 프레임 시작 -->
    <div class="phone-container">

        <!-- 뒤로가기 버튼 및 상단 텍스트 글씨랑 겹치면 옮기기-->
        <a href="index.html" class="back-btn">←</a>
        <p class="header-text">Noodles and Ramen</p>

        <!-- 2. 메인 콘텐츠 영역 시작 -->
        <div class="content-body">
            <h1 class="title">🍜면의 역사</h1>

            <!-- 중국 -->
            <div class="history-item">
                <div class="country">중국🇨🇳</div>
                <p>기원전 <strong>2000</strong>년경 밀가루 반죽으로 만든 면이 처음 생겼고, <strong>8</strong>세기 삼국시대에 현재와 같은 긴 면 형태가 정착했습니다.</p>
            </div>

            <!-- 한국 -->
            <div class="history-item">
                <div class="country">한국🇰🇷</div>
                <p><strong>12</strong>세기 초 송나라 사신 서긍이 쓴 《고려도경》 에 <br>고려 시대의 면 기록이 처음 등장하며, <br>당시 귀한 잔치 음식으로 쓰였습니다.</p>
            </div>

            <!-- 일본 -->
            <div class="history-item">
                <div class="country">일본🇯🇵</div>
                <p>당·송나라 시기 승려와 유학생을 통해 <br>중국의 제분 및 면 기술이 건너가 우동과 소바가 발달했습니다.</p>
            </div>

            <!-- 오른쪽 주황색 화살표 -->
            <a href="page3.html" class="arrow-next" title="다음으로"></a>
        </div> 
        <!-- 메인 콘텐츠 영역 끝 -->

        <!-- 3. 하단 라면 영역 시작 -->
        <div class="content-bottom">
            <div class="ramen-bowl">
                <h1>🍜</h1>
            </div>
        </div>
        <!-- 하단 영역 끝 -->

    </div> 
    <!-- 전체 아이폰 프레임 끝 -->

</body>
</html>
