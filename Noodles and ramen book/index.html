<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍜🍜🍜</title>
    <style>
        /* 기본 스타일 초기화 */
        body, h1, div, p {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 전체 배경색 */
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 아이폰 16 프로로 맞춘 화면 */
        .phone-container {
            width: 375px; /* 대략적인 모바일 너비 */
            height: 812px; /* 대략적인 모바일 높이*/
            background-color: #fff;
            border-radius: 40px; /* 아이폰의 둥근 모서리 20에서 40으로 높임 */
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); /* 그림자 효과 */
            overflow: hidden; /* 모서리 밖으로 나가는 콘텐츠 숨김 */
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 왼쪽 상단 텍스트 */
        .header-text {
            color: #b0b0b0; /* 연한 회색 */
            font-size: 14px;
            font-family: ari;
            padding: 20px 0 0 20px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10; /* 줄무늬 위에 보이도록 */
        }

        /* 상단 콘텐츠 영역 */
        .content-top {
            flex: 1; /* 남은 공간 차지 */
            display: flex;
        }

        /* 상단 왼쪽 (흰색 배경) */
        .content-left {
            flex: 1; /* 왼쪽 절반 차지 */
            background-color: #fff;
        }

        /* 상단 오른쪽 (주황색 줄무늬) */
        .content-right {
            flex: 1; /* 오른쪽 절반 차지 */
            background-color: #fff; /* 기본 배경 흰색 */
            background-image: linear-gradient(
                90deg,
                #fff 50%,     /* 흰색 50% */
                #ffa500 50%   /* 주황색 50% */
            );
            background-size: 20%; /* 줄무늬의 너비 조절 */
            /* 참고: background-size가 20%이면 5개의 흰색-주황색 세트가 나타납니다. */
        }

        /* 하단 주황색 블록 */
        .content-bottom {
            height: 250px; /* 이미지와 비슷한 높이 설정 */
            background-color: #ff8533; /* 좀 더 진한 주황색 (이미지의 오렌지색) */
            display: flex;
            justify-content: flex-end; /* 내용을 오른쪽으로 정렬 */
            align-items: center; /* 내용을 세로 가운데 정렬 */
            padding-right: 20px; /* 오른쪽 여백 */
        }

        /* 라면 이미지 스타일 -> 텍스트로 바꾸기 */
        .ramen-bowl {
            display: inline-block;
            text-decoration: none;
            width: 200px; /* 이미지 없애고 텍스트로 돌리기 */
            height: auto; /* 비율 유지 */
            text-align: center;
            font-size: 80px; /* 텍스트로 돌리니까 폰트 사이즈로 유지*/
            color: white;
            border: 0px dashed white; /* 이미지 위치 표시용, 점선 삭제 */
            padding: 0px;
        }
        h1 {
            margin: 0;
            line-height: 1; 
            }

    </style>
</head>
<body>
    <div class="phone-container">
        <!-- 상단 텍스트 -->
        <p class="header-text">Noodles and Ramen</p> <!--상단에 제목 넣어주기-->

        <!-- 상단 콘텐츠 영역 -->
        <div class="content-top">
            <div class="content-left">
                <!-- 여기에 왼쪽 콘텐츠 추가-->
            </div>
            <div class="content-right">
                <!-- 주황색 줄무늬 배경 -->
            </div>
        </div>

        <!-- 하단 주황색 블록 영역 -->
        <div class="content-bottom">
        <!--라면이모지를 텍스트로 바꿔서 올리기 그리고 텍스트에 링크 -->
        <a href="history.html" class="text-link ramen-bowl">
        <h1>🍜</h1>
        </a>
        </div>
</body>
</html>
