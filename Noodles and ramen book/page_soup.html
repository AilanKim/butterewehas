<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍜🍜🍜</title>
    <style>
        /* 기본 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f4f4f4;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 아이폰 16 프로 프레임 */
        .phone-container {
            width: 375px;
            height: 812px;
            background-color: #fce2c7; /* 상단 연한 살구색 배경 */
            border-radius: 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 상단 네비게이션 헤더 */
        .top-nav {
            position: absolute;
            top: 24px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 30;
        }

        .back-btn {
            font-size: 20px;
            font-weight: bold;
            color: #1a1a1a;
            text-decoration: none;
            line-height: 1;
        }

        .header-text {
            color: #1a1a1a;
            font-size: 16px;
            font-weight: bold;
        }

        /* 상단 살구색 영역 (이모지) */
        .content-top {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 30px;
        }

        .ramen-emoji {
            font-size: 80px;
            user-select: none;
        }

        /* 하단 주황색 바텀 시트 영역 */
        .content-bottom {
            background-color: #ff7f36;
            border-top-left-radius: 36px;  /* 상단 라운드 처리 */
            border-top-right-radius: 36px;
            padding: 40px 20px 50px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 버튼 모아주는 컨테이너 */
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 16px;               /* 버튼 간격 */
            align-items: center;
            width: 100%;
        }

        /* 이전 페이지와 동일한 흰색 알약 버튼 공통 스타일 */
        .menu-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 190px;                 
            padding: 13px 0;              
            background-color: #ffffff;    /* 깔끔한 흰색 바탕 */
            border-radius: 22px;      /* 둥근 알약 모서리 */
            
            font-size: 18px;
            font-family: Verdana, sans-serif;             
            font-weight: bold;            
            text-decoration: none;        
            
            box-shadow: 0 2px 0px rgba(0, 0, 0, 0.05); 
            transition: transform 0.1s, background-color 0.1s;
        }

        .menu-btn:active {
            transform: scale(0.96); /* 터치 피드백 효과 */
            background-color: #f8f8f8;
        }

        .spicysoup {
            color: red;
        }

        .originsoup {
            color : orange
        }

        .soup {
            color: brown;
        }

    </style>
</head>
<body>

    <div class="phone-container">
        <!-- 상단 네비게이션 (뒤로가기 + 타이틀) -->
        <div class="top-nav">
            <a href="page_ramen.html" class="back-btn">←</a>
            <span class="header-text">Noodles and Ramen</span>
        </div>

        <!-- 상단 살구색 영역 (이모지) -->
        <div class="content-top">
            <span class="ramen-emoji">🍜</span>
        </div>

        <!-- 하단 주황색 바텀 시트 영역 (버튼 3개) -->
        <div class="content-bottom">
            <div class="menu-container">
                <a href="Korea_ramen_spciysoup/yeolramen.html" class="menu-btn spicysoup">Spicy Soup</a>
                <a href="Korea_ramen_originsoup/cham.html" class="menu-btn originsoup">Origin Soup</a>
                <a href="Korea_ramen_soup/miyeok.html" class="menu-btn soup">Soup</a>
            </div>
        </div>
    </div>

</body>
</html>
