<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍜 Noodles & Ramen</title>
    <style>
        /* 기본 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f4f4f4;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 아이폰 16 프로 프레임 */
        .phone-container {
            width: 375px;
            height: 812px;
            background-color: #fce2c7; /* 상단 연한 살구색 배경 */
            border-radius: 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 상단 네비게이션 (뒤로가기 + 타이틀) */
        .top-nav {
            position: absolute;
            top: 24px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 30;
        }

        .back-btn {
            font-size: 20px;
            font-weight: bold;
            color: #1a1a1a; /* 어두운 색상 적용 */
            text-decoration: none;
            line-height: 1;
        }

        .header-text {
            color: #1a1a1a; /* 어두운 색상 적용 */
            font-size: 16px;
            font-weight: bold;
        }

        /* 상단 영역 (전골/라면 이모지 중앙 배치) */
        .content-top {
            flex: 1; /* 남은 위쪽 공간을 모두 차지 */
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 30px;
        }

        .ramen-emoji {
            font-size: 80px;
            user-select: none;
        }

        /* 하단 주황색 바텀 시트 영역 */
        .content-bottom {
            background-color: #ff7f36;
            border-top-left-radius: 36px;  /* 이미지처럼 상단 라운드 처리 */
            border-top-right-radius: 36px;
            padding: 35px 20px 40px 20px;   /* 위아래 균형 잡힌 패딩 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 버튼 모아주는 컨테이너 */
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 12px;               /* 4개 버튼에 맞춘 알맞은 간격 */
            align-items: center;
            width: 100%;
        }

        /* 흰색 알약 형태 버튼 스타일 */
        .menu-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 190px;                 
            padding: 12px 0;              
            background-color: #ffffff;    /* 깔끔한 흰색 바탕 */
            border-radius: 22px;          /* 둥근 알약 모서리 */
            
            color: #ff7f36;               /* 주황색 폰트 */
            font-size: 18px;
            font-family: Verdana, sans-serif;             
            font-weight: bold;            
            text-decoration: none;        
            
            box-shadow: 0 2px 0px rgba(0, 0, 0, 0.05); 
            transition: transform 0.1s, background-color 0.1s;
        }

        .menu-btn:active {
            transform: scale(0.96); /* 클릭 효과 */
            background-color: #f8f8f8;
        }

    </style>
</head>
<body>

    <div class="phone-container">
        <!-- 상단 네비게이션 헤더 -->
        <div class="top-nav">
            <a href="page3.html" class="back-btn">←</a>
            <span class="header-text">Noodles and Ramen</span>
        </div>

        <!-- 상단 영역 (이모지) -->
        <div class="content-top">
            <span class="ramen-emoji">🍜</span>
        </div>

        <!-- 하단 영역 (주황색 바텀 시트 + 4개 버튼) -->
        <div class="content-bottom">
            <div class="menu-container">
                <a href="Korea_ramen_brands/odduki.html" class="menu-btn">Brand</a>
                <a href="page_soup.html" class="menu-btn">Soup</a>
                <a href="Korea_bibim/bibimmyeon.html" class="menu-btn">Bibim</a>
            </div>
        </div>
    </div>

</body>
</html>
